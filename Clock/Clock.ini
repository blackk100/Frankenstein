[Rainmeter]
Update=500
DefaultUpdateDivider=1
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Clock
Author=ppick CH | Modified by blackk100
Information=Source: https://github.com/khanhas/mnmlUI | The clock from Clock Hun Style was used in Clock Future Style, with a 24-hour format.
Version=1.2_1.5
License=Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0)

[Variables]
Color=255,255,255

[StyleText]
Meter=String
FontFace=Futurist Fixed-width
FontColor=#Color#
StringCase=Upper
AntiAlias=1

[MeasureHour]
Measure=Time
Format=%I
UpdateDivider=120

[MeasureMinute]
Measure=Time
Format=%M
UpdateDivider=2

[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeasureDate]
Measure=Time
Format=%B %d, %Y
FormatLocale=Local
UpdateDivider=120

[MeasureWeekDay]
Measure=Time
Format=%A
FormatLocale=Local
UpdateDivider=120

[MeterShape]
Meter=Shape
X=70
Y=70
Shape=Ellipse 0,0,63 | StrokeWidth 2 | StrokeColor #Color# | Fill Color 0,0,0,0
Shape2=Rectangle (-3 + 16 * sin(([MeasureHour] * 60 + [MeasureMinute]) * PI / 360)),(-16 * (1 + cos(([MeasureHour] * 60 + [MeasureMinute]) * PI / 360))),6,32,3 | Rotate (([MeasureHour] * 60 + [MeasureMinute]) / 2)
Shape3=Rectangle (-1 + 35 * sin([MeasureMinute] * PI / 30)),(-35 * (1 + cos([MeasureMinute] * PI / 30))),2,70,1 | Rotate ([MeasureMinute] * 6)
Shape4=Ellipse 0,0,7 | StrokeWidth 0 | Fill Color #color#
Shape5=Ellipse 0,0,4
Shape6=Combine Shape4 | Union Shape2 | Union Shape 3 | XOR Shape5
Shape7=Rectangle 105,-63,2,126 | StrokeWidth 0 | Fill Color #color#
AntiAlias=1

[MeterTime]
Meter=String
MeasureName=MeasureTime
MeterStyle=StyleText
FontSize=22
X=210
Y=21

[MeterDate]
Meter=String
MeasureName=MeasureDate
MeterStyle=StyleText
FontSize=14
X=r
Y=7R

[MeterWeekDay]
Meter=String
MeasureName=MeasureWeekDay
MeterStyle=StyleText
FontSize=14
X=r
Y=7R
